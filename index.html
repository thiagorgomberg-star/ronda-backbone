<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5f99">
<title>Ronda Backbone Multivale</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="leaflet.css">
<style>
/* Layout: app de campo, uma coluna, barra superior fixa e barra de ações embaixo; alvos de toque grandes, leitura sob sol */
:root{
  --bg:#eef2f5; --surface:#ffffff; --surface-2:#f6f8fa; --line:#cdd6de; --line-strong:#8796a3;
  --ink:#14191e; --muted:#53616d; --accent:#0b5f99; --accent-ink:#ffffff; --accent-soft:#dcebf6;
  --orange:#d9480f; --ok:#1f7a3a; --ok-soft:#dff1e4; --bad:#b4231b; --bad-soft:#f8e1df; --warn-soft:#fdeedd;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-cond:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#182027; --surface-2:#1e2830; --line:#2e3a44; --line-strong:#5d6d7a;
  --ink:#e8eef2; --muted:#9aa9b5; --accent:#4aa3e0; --accent-ink:#06121b; --accent-soft:#16324a;
  --orange:#ff8a50; --ok:#5cc47a; --ok-soft:#173523; --bad:#ff7b72; --bad-soft:#3d1c1a; --warn-soft:#3a2a17; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#182027; --surface-2:#1e2830; --line:#2e3a44; --line-strong:#5d6d7a;
  --ink:#e8eef2; --muted:#9aa9b5; --accent:#4aa3e0; --accent-ink:#06121b; --accent-soft:#16324a;
  --orange:#ff8a50; --ok:#5cc47a; --ok-soft:#173523; --bad:#ff7b72; --bad-soft:#3d1c1a; --warn-soft:#3a2a17; color-scheme:dark }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;display:flex;align-items:center;gap:12px}
.top .logo{height:38px;width:auto;flex-shrink:0;background:#fff;border-radius:6px;padding:2px 4px}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font-family:var(--f-cond);font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:44px;height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;gap:6px;font-weight:600;font-size:14px}
.iconbtn svg{width:20px;height:20px}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-family:var(--f-cond);font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.card h3{margin:4px 0 0;font-family:var(--f-cond);font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.num{display:inline-flex;width:24px;height:24px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:14px;align-items:center;justify-content:center;font-family:var(--f-body)}
.muted{color:var(--muted)}
.small{font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:480px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
label.lb,.lb{font-family:var(--f-cond);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lb .req{color:var(--bad)}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line-strong);border-radius:var(--r);background:var(--surface);padding:10px 12px;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn{min-height:52px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;font-size:16px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn svg{width:22px;height:22px;flex-shrink:0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.stop{background:var(--surface);border-color:var(--bad);color:var(--bad)}
.btn.wa{background:#1f9d55;border-color:#1f9d55;color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.btn{flex:1 1 150px}
.seg{display:flex;border:1.5px solid var(--line-strong);border-radius:var(--r);overflow:hidden;min-height:46px}
.seg button{flex:1;border:0;background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;padding:0 6px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.ck button[data-v="OK"][aria-pressed="true"]{background:var(--ok);color:#fff}
.seg.ck button[data-v="NC"][aria-pressed="true"]{background:var(--bad);color:#fff}
.seg.ck button[data-v="NA"][aria-pressed="true"]{background:var(--line-strong);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.gps{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);align-self:flex-start}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line-strong);flex-shrink:0}
.gps.ok .dot{background:var(--ok);box-shadow:0 0 0 4px var(--ok-soft)}
.gps.weak .dot{background:var(--orange)}
.gps.err .dot{background:var(--bad)}
.map{height:280px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--surface-2);z-index:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.item .badge{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-variant-numeric:tabular-nums}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tx span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.04em}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.draft{background:var(--warn-soft);color:var(--orange)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:15;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding:10px 16px;margin:0 -16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.steps::-webkit-scrollbar{display:none}
.steps button{flex-shrink:0;min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px}
.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button .chk{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.steps button.done .chk{background:var(--ok)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.bar .in{max-width:720px;width:100%;display:flex;gap:10px}
.bar .btn{flex:1}
.check-row{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.check-row:first-of-type{border-top:0}
.check-row .q{font-weight:600}
.fo-tools{display:flex;gap:8px;flex-wrap:wrap}
.fo-tools .btn{min-height:44px;font-size:14px;flex:1 1 140px}
.fo{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.fo.on{border-color:var(--accent);background:var(--accent-soft)}
.fo-head{display:flex;align-items:center;gap:10px}
.fo-n{font-weight:700;font-size:17px;min-width:56px;font-variant-numeric:tabular-nums}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid #333;display:inline-block;vertical-align:-2px}
.fo-head .meta{flex:1;font-size:14px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tog{min-height:44px;min-width:118px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);font-weight:700;cursor:pointer;font-size:14px}
.fo.on .tog{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fo-body{display:grid;grid-template-columns:90px minmax(0,1fr) 84px;gap:8px}
.fo-body select,.fo-body input{min-height:44px;padding:6px 8px}
.photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.photos{grid-template-columns:minmax(0,1fr)}}
.ph{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#000}
.ph .pb{padding:8px;display:flex;flex-direction:column;gap:6px}
.ph select,.ph input{min-height:42px;font-size:15px;padding:6px 8px}
.ph .del{min-height:40px;border:1px solid var(--bad);color:var(--bad);background:transparent;border-radius:8px;font-weight:600;cursor:pointer}
.sig{border:1.5px dashed var(--line-strong);border-radius:12px;background:#fff;touch-action:none;width:100%;height:180px;display:block}
.warnbox{border:1px solid var(--orange);background:var(--warn-soft);border-radius:12px;padding:12px;font-size:14px}
.okbox{border:1px solid var(--ok);background:var(--ok-soft);border-radius:12px;padding:12px;font-size:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
table.t th{font-family:var(--f-cond);text-transform:uppercase;font-size:12px;letter-spacing:.05em;color:var(--muted)}
table.t td.r,table.t th.r{text-align:right}
.tw{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font-family:var(--f-cond);font-size:28px;font-weight:700;line-height:1.1;text-wrap:balance}
.clock{font-variant-numeric:tabular-nums}
.leaflet-container{font:inherit}
.mk{background:var(--accent);color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.mk.start{background:#1f7a3a}.mk.me{background:#d9480f;width:18px;height:18px}
@media (prefers-reduced-motion:no-preference){.btn,.tog,.seg button{transition:background .15s,color .15s}}
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="logo.png" alt="Multivale Engenharia">
  <div class="ttl"><b id="topTitle">Ronda Preventiva Backbone</b><span id="topSub">Inspeção de caixas de emenda</span></div>
  <button class="iconbtn" id="btnBack" hidden aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Início</button>
</header>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="in" id="barIn"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" multiple hidden>

<script src="leaflet.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script>
'use strict';
/* ============================ utilidades ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = n => String(n).padStart(2, '0');
const fData = ts => { const d = new Date(ts); return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; };
const fHora = ts => { const d = new Date(ts); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const fHoraS = ts => { const d = new Date(ts); return `${fHora(ts)}:${pad2(d.getSeconds())}`; };
const fDH = ts => `${fData(ts)} ${fHora(ts)}`;
const fDur = ms => { if (!(ms > 0)) return '0 min'; const m = Math.round(ms / 60000); const h = Math.floor(m / 60); return h ? `${h}h ${pad2(m % 60)}min` : `${m} min`; };
const fClock = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${pad2(Math.floor(s/3600))}:${pad2(Math.floor(s/60)%60)}:${pad2(s%60)}`; };
const fKm = km => (km || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' km';
const isoDate = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const COLORS = [['Verde','#2e8b3e'],['Amarelo','#f2c200'],['Branco','#ffffff'],['Azul','#1f5fbf'],['Vermelho','#c8102e'],['Violeta','#7a3fa0'],['Marrom','#7a4a1e'],['Rosa','#f08ab0'],['Preto','#141414'],['Cinza','#8a8a8a'],['Laranja','#f07c00'],['Azul-claro','#5ec8e0']];
const tf = n => ({ t: Math.floor((n - 1) / 12) + 1, f: ((n - 1) % 12) + 1 });
const foTxt = n => { const { t, f } = tf(n); return `T${t} ${COLORS[t-1][0]} / F${f} ${COLORS[f-1][0]}`; };
const sw = c => `<i class="sw" style="background:${c}"></i>`;
const hav = (a, b) => { const R = 6371000, r = Math.PI / 180; const dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r; const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLon/2)**2; return 2 * R * Math.asin(Math.sqrt(x)); };
const pathKm = pts => { let m = 0; for (let i = 1; i < pts.length; i++) m += hav(pts[i-1], pts[i]); return m / 1000; };
const gaps = pts => { let n = 0, ms = 0; for (let i = 1; i < pts.length; i++) { const d = pts[i].ts - pts[i-1].ts; if (d > 180000) { n++; ms += d; } } return { n, ms }; };
const ICON = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  stop: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>',
  pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>'
};
let toastT;
function toast(msg, ms = 3200) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

/* ============================ banco local (IndexedDB) ============================ */
const DB = {
  db: null, mem: { rondas: new Map(), inspecoes: new Map(), meta: new Map() },
  open() { return new Promise(res => { try { const r = indexedDB.open('ronda-backbone-multivale', 1);
    r.onupgradeneeded = () => { const d = r.result; ['rondas','inspecoes','meta'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, { keyPath: 'id' }); }); };
    r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); } catch (e) { res(false); } }); },
  req(store, mode, fn) { if (!this.db) return Promise.resolve(fn(null)); return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const q = fn(t.objectStore(store)); t.oncomplete = () => res(q && 'result' in q ? q.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  get(s, id) { return this.db ? this.req(s, 'readonly', st => st.get(id)) : Promise.resolve(this.mem[s].get(id)); },
  all(s) { return this.db ? this.req(s, 'readonly', st => st.getAll()) : Promise.resolve([...this.mem[s].values()]); },
  put(s, v) { return this.db ? this.req(s, 'readwrite', st => st.put(v)) : Promise.resolve(this.mem[s].set(v.id, v)); },
  del(s, id) { return this.db ? this.req(s, 'readwrite', st => st.delete(id)) : Promise.resolve(this.mem[s].delete(id)); }

/* ============================ GPS e percurso ============================ */
function gpsStart() {
  if (!('geolocation' in navigator)) { S.gps = { status: 'err', last: null, msg: 'Este aparelho não tem GPS disponível no navegador.' }; updateLive(); return; }
  if (S.watchId != null) return;
  S.gps.status = 'wait'; S.gps.msg = 'Procurando sinal de GPS…'; updateLive();
  S.watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function gpsStop() { if (S.watchId != null) navigator.geolocation.clearWatch(S.watchId); S.watchId = null; S.gps.status = 'off'; S.gps.msg = 'GPS desligado'; }
function onPos(p) {
  const pt = { lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), ts: Date.now(), acc: Math.round(p.coords.accuracy || 0) };
  S.gps.last = pt;
  S.gps.status = pt.acc <= 50 ? 'ok' : 'weak';
  S.gps.msg = pt.acc <= 50 ? `GPS ativo · precisão ±${pt.acc} m` : `Sinal fraco · ±${pt.acc} m`;
  const r = S.ronda;
  if (r && !r.fim && pt.acc <= 50) {
    const last = r.pontos[r.pontos.length - 1];
    let keep = !last;
    if (last) { const d = hav(last, pt), dt = (pt.ts - last.ts) / 1000; const speed = dt > 0 ? d / dt : 0; keep = (d >= 8 && speed < 45) || (dt > 120 && speed < 45); }
    if (keep) { r.pontos.push(pt); saveRonda(); }
  }
  updateLive();
}
function onPosErr(e) {
  S.gps.status = 'err';
  S.gps.msg = e.code === 1 ? 'Localização bloqueada. Libere a permissão de localização para este app.' : e.code === 3 ? 'GPS sem resposta. Vá para céu aberto.' : 'Não foi possível obter a localização.';
  updateLive();
}
function posAtual(maxAge = 60000) {
  return new Promise(res => {
    const l = S.gps.last; if (l && Date.now() - l.ts < maxAge && l.acc <= 80) return res(l);
    if (!('geolocation' in navigator)) return res(l || null);
    navigator.geolocation.getCurrentPosition(p => { const pt = { lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6), ts: Date.now(), acc: Math.round(p.coords.accuracy || 0) }; S.gps.last = pt; res(pt); },
      () => res(l || null), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
async function wakeOn() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible' && !S.wake) { S.wake = await navigator.wakeLock.request('screen'); S.wake.addEventListener('release', () => { S.wake = null; }); } } catch (e) { S.wake = null; } }
function wakeOff() { try { S.wake && S.wake.release(); } catch (e) {} S.wake = null; }
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (S.ronda && !S.ronda.fim) { wakeOn(); gpsStart(); } render(); }
  else { saveRonda(true); saveInsp(true); }
});
window.addEventListener('pagehide', () => { saveRonda(true); saveInsp(true); });

async function reverseGeo(lat, lon) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 9000);
  try { const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&accept-language=pt-BR&zoom=18&addressdetails=1`, { signal: ctl.signal, headers: { 'Accept': 'application/json' } });
    if (!r.ok) return null; const j = await r.json(); const a = j.address || {};
    return { endereco: [a.road || a.pedestrian || a.footway || a.path || '', a.house_number].filter(Boolean).join(', '), bairro: a.suburb || a.neighbourhood || a.quarter || a.city_district || '', cidade: [a.city || a.town || a.village || a.municipality || '', a.state_code || (a['ISO3166-2-lvl4'] || '').replace('BR-', '')].filter(Boolean).join(' - '), completo: j.display_name || '' };
  } catch (e) { return null; } finally { clearTimeout(t); }
}

function segmentos(r) {
  if (!r) return [];
  const ev = [...r.eventos].sort((a, b) => a.ts - b.ts);
  const ini = ev.find(e => e.tipo === 'inicio'); if (!ini) return [];
  const chegadas = ev.filter(e => e.tipo === 'chegada');
  const tagOf = id => { const i = S.inspCache.get(id); return (i && i.info.tag) || 'sem TAG'; };
  const segs = []; let fromTs = ini.ts, fromLb = 'Início da ronda', fromLoc = ini;
  chegadas.forEach((ch, k) => {
    const sai = ev.find(e => e.tipo === 'saida' && e.inspId === ch.inspId);
    segs.push({ tipo: k === 0 ? 'desl' : 'cabo', de: fromLb, para: 'Caixa ' + tagOf(ch.inspId), ini: fromTs, fim: ch.ts, a: fromLoc, b: ch, inspId: ch.inspId });
    fromTs = sai ? sai.ts : ch.ts; fromLb = 'Caixa ' + tagOf(ch.inspId); fromLoc = ch;
  });
  const end = r.fim || Date.now();
  if (end > fromTs) segs.push({ tipo: r.fim ? (chegadas.length ? 'ret' : 'desl') : 'atual', de: fromLb, para: r.fim ? 'Fim da ronda' : 'Posição atual', ini: fromTs, fim: end, a: fromLoc });
  segs.forEach(s => { s.pts = r.pontos.filter(p => p.ts >= s.ini && p.ts <= s.fim); if (s.a && s.a.lat != null) s.pts.unshift(s.a); if (s.b && s.b.lat != null) s.pts.push(s.b); s.km = pathKm(s.pts); s.gap = gaps(s.pts); });
  return segs;
}
const SEGLB = { desl: 'Deslocamento', cabo: 'Rota do cabo', ret: 'Retorno', atual: 'Em deslocamento' };
const SEGCOR = { desl: '#d9480f', cabo: '#0b5f99', ret: '#6b7785', atual: '#7a3fa0' };
function totais(r) {
  const segs = segmentos(r); const t = { km: 0, desl: 0, cabo: 0, ret: 0, atual: 0, caixas: r ? r.eventos.filter(e => e.tipo === 'chegada').length : 0, dur: r ? (r.fim || Date.now()) - r.inicio : 0, gapN: 0, gapMs: 0 };
  segs.forEach(s => { t.km += s.km; t[s.tipo] += s.km; t.gapN += s.gap.n; t.gapMs += s.gap.ms; });
  return { t, segs };
}

/* ============================ ações da ronda ============================ */
async function iniciarRonda() {
  if (!S.perfil.nome.trim()) { toast('Preencha o nome do técnico antes de iniciar.'); $('#pf_nome') && $('#pf_nome').focus(); return; }
  await DB.put('meta', S.perfil);
  gpsStart(); wakeOn();
  const loc = await posAtual(30000);
  const now = Date.now();
  S.ronda = { id: uid(), tecnico: S.perfil.nome.trim(), matricula: S.perfil.matricula, placa: S.perfil.placa, inicio: now, fim: null, pontos: loc ? [loc] : [], eventos: [{ tipo: 'inicio', ts: now, lat: loc && loc.lat, lon: loc && loc.lon }] };
  await DB.put('rondas', S.ronda); await DB.put('meta', { id: 'ativa', rondaId: S.ronda.id });
  toast(loc ? 'Ronda iniciada. Deslocamento sendo registrado.' : 'Ronda iniciada. Aguardando sinal de GPS.');
  render();
}
async function encerrarRonda() {
  if (!S.ronda) return;
  if (!confirm('Encerrar a ronda agora? O percurso para de ser registrado.')) return;
  const loc = await posAtual(60000);
  if (loc && S.ronda.pontos.length && loc.ts > S.ronda.pontos[S.ronda.pontos.length - 1].ts) S.ronda.pontos.push(loc);
  S.ronda.fim = Date.now(); S.ronda.eventos.push({ tipo: 'fim', ts: S.ronda.fim, lat: loc && loc.lat, lon: loc && loc.lon });
  await DB.put('rondas', S.ronda); await DB.put('meta', { id: 'ativa', rondaId: null });
  gpsStop(); wakeOff();
  const id = S.ronda.id; S.ronda = null; S.rondaView = await DB.get('rondas', id);
  go('ronda');
}
async function novaInsp() {
  toast('Registrando chegada na caixa…', 2000);
  const loc = await posAtual(45000);
  const i = novaInspecao(loc);
  if (S.ronda && !S.ronda.fim) { S.ronda.eventos.push({ tipo: 'chegada', ts: i.chegada, inspId: i.id, lat: loc && loc.lat, lon: loc && loc.lon, acc: loc && loc.acc }); if (loc && (!S.ronda.pontos.length || loc.ts > S.ronda.pontos[S.ronda.pontos.length-1].ts)) S.ronda.pontos.push(loc); saveRonda(true); }
  S.insp = i; S.step = 0; S.inspCache.set(i.id, i); await DB.put('inspecoes', i);
  go('insp');
  if (loc) preencherEndereco(true);
}
async function preencherEndereco(soVazios) {
  const i = S.insp; if (!i || !i.loc) return;
  const a = await reverseGeo(i.loc.lat, i.loc.lon);
  if (!a) { toast('Sem internet para buscar o endereço. Preencha à mão.'); return; }
  ['endereco','bairro','cidade'].forEach(k => { if (a[k] && (!soVazios || !i.info[k])) i.info[k] = a[k]; });
  i.loc.endCompleto = a.completo; saveInsp(); if (S.view === 'insp' && STEPS[S.step][0] === 'caixa') render(); toast('Endereço preenchido pelo GPS.');
}
async function concluirInsp() {
  const i = S.insp; if (!i) return;
  if (!i.info.tag.trim()) { toast('Preencha a TAG da caixa.'); S.step = 0; render(); return; }
  i.status = 'concluida'; i.saida = Date.now();
  const r = S.ronda && S.ronda.id === i.rondaId ? S.ronda : null;
  if (r && !r.eventos.some(e => e.tipo === 'saida' && e.inspId === i.id)) { r.eventos.push({ tipo: 'saida', ts: i.saida, inspId: i.id }); saveRonda(true); }
  saveInsp(true); toast(r ? 'Inspeção concluída. Percurso até a próxima caixa sendo registrado.' : 'Inspeção concluída.');

}

  const end = () => { if (!drawing) return; drawing = false; i.assinatura = c.toDataURL('image/png'); saveInsp(); pendUpd(); };
  c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  $('#bSigClear').onclick = () => { x.clearRect(0, 0, w, h); i.assinatura = null; saveInsp(); pendUpd(); };
}

function pdfHeader(doc, logo, titulo, sub, tag) {

function pdfSec(doc, y, n, titulo) {

const TB = { theme: 'grid', margin: { left: 12, right: 12 }, styles: { fontSize: 8.5, cellPadding: 1.8, lineColor: [150, 160, 170], lineWidth: 0.2, textColor: 20 }, headStyles: { fillColor: [233, 238, 241], textColor: 20, fontStyle: 'bold', fontSize: 8 } };

async function mapaImg(lines, marks, w = 1400, h = 800) {
  const all = [...lines.flatMap(l => l.pts), ...marks].filter(p => p && p.lat != null);
  if (!all.length) return null;
  const lon2x = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
  const lat2y = (lat, z) => { const s = Math.sin(lat * Math.PI / 180); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * 2 ** z; };
  let mnLa = Infinity, mxLa = -Infinity, mnLo = Infinity, mxLo = -Infinity;
  all.forEach(p => { mnLa = Math.min(mnLa, p.lat); mxLa = Math.max(mxLa, p.lat); mnLo = Math.min(mnLo, p.lon); mxLo = Math.max(mxLo, p.lon); });
  const padd = 70; let z = 17;
  for (; z > 3; z--) { if (lon2x(mxLo, z) - lon2x(mnLo, z) <= w - 2 * padd && lat2y(mnLa, z) - lat2y(mxLa, z) <= h - 2 * padd) break; }
  const cx = (lon2x(mnLo, z) + lon2x(mxLo, z)) / 2, cy = (lat2y(mxLa, z) + lat2y(mnLa, z)) / 2, ox = cx - w / 2, oy = cy - h / 2;
  const draw = async withTiles => {
    const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
    x.fillStyle = '#e9eef1'; x.fillRect(0, 0, w, h);
    if (withTiles) {
      const n = 2 ** z, jobs = [];
      for (let tx = Math.floor(ox / 256); tx <= Math.floor((ox + w) / 256); tx++) for (let ty = Math.floor(oy / 256); ty <= Math.floor((oy + h) / 256); ty++) {
        if (ty < 0 || ty >= n) continue; const wx = ((tx % n) + n) % n;
        jobs.push(new Promise(res => { const im = new Image(); im.crossOrigin = 'anonymous'; const t = setTimeout(() => res(false), 8000); im.onload = () => { clearTimeout(t); x.drawImage(im, tx * 256 - ox, ty * 256 - oy); res(true); }; im.onerror = () => { clearTimeout(t); res(false); }; im.src = `https://tile.openstreetmap.org/${z}/${wx}/${ty}.png`; }));
      }
      const ok = await Promise.all(jobs); if (!ok.some(Boolean)) return null;
      x.fillStyle = 'rgba(255,255,255,.18)'; x.fillRect(0, 0, w, h);
    } else { x.strokeStyle = '#d3dbe1'; x.lineWidth = 1; for (let g = 0; g < w; g += 80) { x.beginPath(); x.moveTo(g, 0); x.lineTo(g, h); x.stroke(); } for (let g = 0; g < h; g += 80) { x.beginPath(); x.moveTo(0, g); x.lineTo(w, g); x.stroke(); } }
    const P = p => [lon2x(p.lon, z) - ox, lat2y(p.lat, z) - oy];
    lines.forEach(l => { if (l.pts.length < 2) return; [[10, 'rgba(255,255,255,.85)'], [6, l.color]].forEach(([lw, col]) => { x.lineWidth = lw; x.strokeStyle = col; x.lineCap = 'round'; x.lineJoin = 'round'; x.beginPath(); l.pts.forEach((p, k) => { const [a, b] = P(p); k ? x.lineTo(a, b) : x.moveTo(a, b); }); x.stroke(); }); });
    marks.forEach(m => { if (m.lat == null) return; const [a, b] = P(m); x.beginPath(); x.arc(a, b, 17, 0, Math.PI * 2); x.fillStyle = m.color || '#0b5f99'; x.fill(); x.lineWidth = 3; x.strokeStyle = '#fff'; x.stroke(); x.fillStyle = '#fff'; x.font = 'bold 17px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(m.label, a, b + 1); });
    x.font = '14px Arial'; x.textAlign = 'right'; x.textBaseline = 'bottom'; const at = withTiles ? '© OpenStreetMap' : 'Mapa sem fundo (sem internet)'; const tw = x.measureText(at).width; x.fillStyle = 'rgba(255,255,255,.85)'; x.fillRect(w - tw - 12, h - 22, tw + 12, 22); x.fillStyle = '#333'; x.fillText(at, w - 6, h - 4);
    return c.toDataURL('image/jpeg', 0.85);
  };
  try { const d = await draw(true); if (d) return d; } catch (e) {}
  try { return await draw(false); } catch (e) { return null; }
}

    if (img) { if (y > 150) { doc.addPage(); y = 16; } doc.addImage(img, 'JPEG', 12, y - 2, 186, 132.9); y += 133;
      doc.setFontSize(7.5); doc.setFont('helvetica', 'normal'); let lx = 12;
      [['desl', 'Deslocamento'], ['cabo', 'Rota do cabo'], ['ret', 'Retorno']].forEach(([k, lb]) => { doc.setFillColor(SEGCOR[k]); doc.rect(lx, y, 6, 1.6, 'F'); doc.setTextColor(60); doc.text(lb, lx + 8, y + 1.6); lx += 36; });
      doc.text('I = início · F = fim · números = ordem das caixas', 120, y + 1.6); y += 8; }
    y = pdfSec(doc, y, 3, 'Trechos percorridos');
    doc.autoTable({ ...TB, startY: y, head: [['#', 'Tipo', 'De > Para', 'Início', 'Fim', 'Tempo', 'Km']], body: segs.map((s, k) => [k + 1, SEGLB[s.tipo], `${s.de} > ${s.para}`, fHora(s.ini), fHora(s.fim), fDur(s.fim - s.ini), fKm(s.km)]),
      foot: [['', '', 'Total', '', '', fDur(t.dur), fKm(t.km)]], footStyles: { fillColor: [233, 238, 241], textColor: 20, fontStyle: 'bold' }, columnStyles: { 0: { cellWidth: 8, halign: 'center' }, 6: { halign: 'right' } },
      didParseCell: d => { if (d.section === 'body' && d.column.index === 1) { const k = Object.keys(SEGLB).find(x => SEGLB[x] === d.cell.raw); if (k) { d.cell.styles.textColor = SEGCOR[k]; d.cell.styles.fontStyle = 'bold'; } } } });
    y = doc.lastAutoTable.finalY + 7;
    y = pdfSec(doc, y, 4, 'Produção — caixas inspecionadas');
    const ch = r.eventos.filter(e => e.tipo === 'chegada');
    doc.autoTable({ ...TB, startY: y, head: [['#', 'TAG', 'Endereço', 'Chegada', 'Saída', 'Na caixa', 'Fusões', 'N/C', 'Fotos']],
      body: ch.map((e, k) => { const i = S.inspCache.get(e.inspId); if (!i) return [k + 1, '—', '', fHora(e.ts), '', '', '', '', '']; const nf = i.fo.rows.slice(0, i.fo.total).filter(x => x.f).length; const nc = Object.values(i.check).filter(v => v === 'NC').length;
        return [k + 1, i.info.tag || '—', [i.info.endereco, i.info.bairro].filter(Boolean).join(' - ') || '—', fHora(i.chegada), i.saida ? fHora(i.saida) : '—', i.saida ? fDur(i.saida - i.chegada) : '—', `${nf}/${i.fo.total}`, String(nc), String(i.fotos.length)]; }),
      columnStyles: { 0: { cellWidth: 8, halign: 'center' }, 1: { fontStyle: 'bold' }, 6: { halign: 'center' }, 7: { halign: 'center' }, 8: { halign: 'center' } },
      didParseCell: d => { if (d.section === 'body' && d.column.index === 7 && +d.cell.raw > 0) { d.cell.styles.textColor = [180, 35, 27]; d.cell.styles.fontStyle = 'bold'; } } });
    y = doc.lastAutoTable.finalY + 6;
    if (t.gapN) { doc.setFontSize(8); doc.setTextColor(150, 70, 10); doc.text(doc.splitTextToSize(`Atenção: ${t.gapN} trecho(s) ficaram mais de 3 minutos sem posição de GPS (total ${fDur(t.gapMs)}). Nesses trechos a distância é estimada em linha reta.`, 186), 12, y); y += 10; }
    if (y > 250) { doc.addPage(); y = 20; }
    doc.setDrawColor(20); doc.setLineWidth(0.4); doc.line(12, y + 18, 92, y + 18); doc.line(118, y + 18, 198, y + 18); doc.setFontSize(7.5); doc.setTextColor(20); doc.setFont('helvetica', 'bold'); doc.text('TÉCNICO — ' + r.tecnico.toUpperCase(), 12, y + 22); doc.text('SUPERVISOR', 118, y + 22);
    pdfFooter(doc, `Multivale Engenharia · Ronda Preventiva Backbone · gerado em ${fDH(Date.now())}`);
    return new File([doc.output('blob')], nomeArq(`Ronda_${isoDate(r.inicio)}_${r.tecnico}`), { type: 'application/pdf' });
  } catch (e) { console.error(e); toast('Erro ao gerar o PDF: ' + e.message, 6000); return null; }
}

/* ============================ compartilhar ============================ */
function textoInsp(i) { const l = i.loc; return `Inspeção preventiva backbone — Caixa ${i.info.tag || 'sem TAG'}\nTécnico: ${i.info.tecnico}\nData: ${fDH(i.chegada)}${l ? `\nLocal: https://maps.google.com/?q=${l.lat},${l.lon}` : ''}`; }
function textoRonda(r) { const { t } = totais(r); return `Ronda preventiva backbone — ${fData(r.inicio)}\nTécnico: ${r.tecnico}\n${fHora(r.inicio)} às ${r.fim ? fHora(r.fim) : 'agora'} · ${t.caixas} caixa(s) · ${fKm(t.km)}`; }
function baixar(f) { const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000); toast('PDF salvo em Downloads.'); }
async function compartilhar(files, texto) {
  try {
    if (navigator.canShare && navigator.canShare({ files })) { await navigator.share({ files, title: files[0].name, text: texto }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  files.forEach(baixar);
  toast('Este navegador não envia arquivos direto. O PDF foi salvo; anexe no WhatsApp.', 6000);
  setTimeout(() => window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank'), 800);
}

/* ============================ início ============================ */
(async function boot() {
  const ok = await DB.open(); if (!ok) toast('Armazenamento do aparelho indisponível: os dados não serão guardados se o app fechar.', 6000);
  const pf = await DB.get('meta', 'perfil'); if (pf) S.perfil = pf;
  const at = await DB.get('meta', 'ativa');
  if (at && at.rondaId) { const r = await DB.get('rondas', at.rondaId); if (r && !r.fim) { S.ronda = r; await cacheInspRonda(r); gpsStart(); wakeOn(); } }
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
